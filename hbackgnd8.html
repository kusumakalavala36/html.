<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Profile Card</title>
    <style>
        body
        {
            font-family: Georgia, 'Times New Roman', Times, serif;
            background-color: cadetblue;
            margin: 0;
            padding: 50px;
        }
        .profile-card
        {
           width: 350px;
           margin: auto;
           padding: 25px;
           background-color: cornflowerblue;
           border: 1px #fa8072;
           text-align: center;
        }
        .profile-image
        {
           font-size: 60px;
           margin-bottom: 10px;
        }
        h1
        {
           color: rgb(48, 38, 87);
           font-size: 28px;
           font-weight: 700; 
           margin-bottom: 6px;  
        }
        h3
        {
            color: darkblue;
            font-size: 20px;
            font-weight: 400;
            text-align: center;
        }
        .profile-card
        {
            color: indigo;
            font-size: 25px;
            font-weight: 1.6;
        }
        .details
        {
            text-align: left;
            background-color: darkcyan;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
        }
        .details p
        {
            font-size: 14px;
            color: navy;
        }
    </style>
</head>
<body>
    <h3>Professional profile-card</h3>
    <div class="profile-card">
        <div class="profile-image">
            👩‍💻
        </div>
        <h1>Sunny</h1>
        <h3>developer</h3>
        <p>
           Passionate about web Development.
        </p>
        <div class="details">
            <p><strong>Email:</strong> sunny@gmail.com</p>
            <p><strong>Skills:</strong> HTML, C, Python</p>
            <p><strong>student ID : 799878</strong></p>
        </div>
</body>
</html>
