<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         .box{
            width: 80px;
            height: 80px;
            color: white;
            text-align: center;
            line-height: 80px;
            position: absolute;
        }
           .box1{
            background-color: aqua;
            top:0;
            left:0;
            border-radius: 50%;
       }
           .box2{
            background-color: cornflowerblue;
            top:0;
            right: 0;
            border-radius: 50%;
        }
           .box3{
            background-color: darkblue;
            bottom: 0;
            right: 0;
            border-radius: 50%;
        }
           .box4{                   
            background-color: dodgerblue;
            bottom: 0;
            left: 0;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class>
    <div class="box box1">box1</div>
    <div class="box box2">box2</div>
    <div class="box box3">box3</div>
    <div class="box box4">box4</div>
    </div>
    
</body>
</html>
